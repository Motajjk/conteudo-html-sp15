<!DOCTYPE hmtl>
<html lang="pt-br">
    <head>
        <title>Conteúdo aula 10 - HTML</title>
    </head>
    <body>
        
        <h1>Definindo listas no HTML</h1>
        
        <h3>Exemplo de Lista Não Ordenada</h3>
        <ul>
            <li>item</li>
            <li>item</li>
            <li>item</li>
            <li>item</li>
            <li>item</li>
        </ul>
        <hr>

        <h3>Exemplo de Lista Ordenada</h3>
        <ol>
            <li>Primeiro item</li>
            <li>Segundo item</li>
            <li>Terceiro item</li>
            <li>Quarto item</li>
            <li>Quinto item</li>
        </ol>
  
    </body>
</html>
