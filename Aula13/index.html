<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Conteúdo Aula 13 - HTML</title>
        <style>
            .importante {
                color: red;
                font-weight: bold;
                font-size: 150%;
            }

            .cidades {
                background-color: purple;
                border: 6px solid darkorchid;
                color: ghostwhite;
                padding: 10px;
            }

            .centralizado {
                text-align: center;
            }

            .estilo {
                background-color: navy;
                color: aliceblue;
                padding: 10;
                border: 4px solid goldenrod;
            }

        </style>
    </head>
    <body>
        
        <h1>Class em HTML</h1>

        <h2>Título <span class="importante">importante</span> no HTML</h2>
        <p>Exemplo de conteúdo <span class="importante">importante</span> no HTML</p>
        <hr>

        <h2>Definindo mais de uma classe para elementos</h2>

        <h3 class="cidades centralizado">São Paulo</h3>
        <h3 class="cidades">Rio de Janeiro</h3>
        <h3 class="cidades">Belo Horizonte</h3>
        <hr>

        
        <h2>Mesmas classes em elementos diferentes</h2>

        <h3 class="estilo">Eu sou um h3</h3>
        <p class="estilo">Eu sou um parágrafo</p>


    </body>
</html>
