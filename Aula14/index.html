<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Conteúdo Aula 14 - HTML</title>
        <style>
            
            .btn1 {
                background-color: blueviolet;
                border: none;
                color: aliceblue;
                width: 100px;
                height: 45px;
                font-family: monospace;
                font-weight: bold;
                border-radius: 10px;
                cursor: pointer;
            }

            .alert {
                border: 2px solid black;
                background-color: aliceblue;
                border-radius: 5px;

            }

        </style>
    </head>
    <body>
        
        <h1>Botões no HTML</h1>

        <h3>Clique no melhor casal de Jujutsu!</h3>

        <button class="btn1">GojoHime</button>

        <button disabled>SatoSugu</button>
        <hr>

        <h3>Tirar Dúvidas:</h3>

        <button class="alert"; onclick="alert('SatoSugu é um LIXO!!! KKK');">Não entendeu? Clique aqui para esclarecer!</button>
        <hr>

        

    </body>
</html>
