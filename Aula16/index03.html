<!DOCTYPE html>
<html lang="pt-br">

        <meta http-equiv="Content-Type" content="text/html;charset=UTF-8">

    <body>
        
        <h1>Introdução a Formulário no HTML</h1>

        <h3>Input tipo Text</h3>

        <form>
            <label for="p-nome">Primeiro Nome:</label><br>
            <input type="text" name="p-nome" id="p-nome"><br><br>
            <label for="u-nome">Último Nome:</label><br>
            <input type="text" name="u-nome" id="u-nome"><br><br>
            <input type="button" value="Enviar Dados">
        </form>
        <hr>

        <h2>Input tipo Radio</h2>

        <h3>Coloque abaixo o Shipp que mais gosta em Jujutsu!</h3>

        <form>
            <input type="radio" name="shipps" id="gojohime" value="GojoHime">
            <label for="gojohime">GojoHime</label>
            <br>
        <form>
            <input type="radio" name="shipps" id="itakugi" value="ItaKugi">
            <label for="itakugi">ItaKugi</label>
            <br>
        <form>
            <input type="radio" name="shipps" id="satosugu" value="SatoSugu">
            <label for="satosugu">SatoSugu</label>
            <br>
        </form>

    </body>
</html>
