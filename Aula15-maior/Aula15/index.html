<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Conteúdo Aula 15 - HTML</title>
    </head>
    <body>
        
        <h1>JavaScript no HTML</h1>

        <h3>Exemplo de elemento noscript no HTML</h3>

        <p id="meu-paragrafo"></p>
        <button onclick="adicionarConteudo()">Adicionar Conteúdo</button>
        <script>
            function adicionarConteudo() {
                document.getElementById("meu-paragrafo").innerHTML = "Somente a dor coletiva gera união!";
            }
        </script>
        <noscript style="color: red";>Foi mal parceirão, seu JavaScript foi de arrasta!</noscript>

    </body>
</html>
